<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bootstrap Sample</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-md-12">

                <div class="bg-light p-5 rounded shadow">

                    <h2 class="text-center text-white bg-danger p-3 rounded">
                        Product Inventory System
                    </h2>

                    <hr>

                    <form method="post">
                        {% csrf_token %}
                        <div class="row align-items-center">

                            <div class="col-md-4">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text" placeholder="Type here to search" class="form-control" required>
                                </div>
                            </div>

                            <div class="col-md-8 text-md-end mt-3 mt-md-0">
                                <a href="{% url 'web2' %}" class="btn btn-danger me-2">ADD_PRODUCTS</a>
                                <a href="{% url 'web3' %}" class="btn btn-danger me-2">ADD_CUSTOMERS</a>
                                <a href="{%url 'web4' %}" class="btn btn-danger">GET_PRODUCTS</a>
                            </div>

                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
