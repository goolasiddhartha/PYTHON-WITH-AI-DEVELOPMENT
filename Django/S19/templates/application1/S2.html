<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bootstrap Sample</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center text-white bg-danger">ADD Products</h2>
                <br>
                <form action="" method="post">
                    <label for="">Pid</label>
                    <input type="text" placeholder="Pid" class="form-control" autocomplete="off">
                    <br>
                    <br>
                    <label for="">Pname</label>
                    <input type="text" placeholder="Pname" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">Price</label>
                    <input type="text" placeholder="Price" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">Company</label>
                    <input type="text" placeholder="Company" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">M_date</label>
                    <input type="text" placeholder="M_date" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <input type="submit" value="ADD_PRODUCTS" class="btn btn-danger">
                    <br>
                    <br>
                    <a href="{% url 'web1' %}" class="btn btn-danger">GO TO DASHBOARD</a>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
