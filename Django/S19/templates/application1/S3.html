<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bootstrap Sample</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center text-white bg-danger">ADD Customers</h2>
                <br>
                <form action="" method="post">
                    <label for="">Cid</label>
                    <input type="text" placeholder="Cid" class="form-control" autocomplete="off">
                    <br>
                    <br>
                    <label for="">Cname</label>
                    <input type="text" placeholder="Cname" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">Address</label>
                    <input type="text" placeholder="Address" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">Mobile_Number</label>
                    <input type="text" placeholder="Mobile_Number" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <label for="">City</label>
                    <input type="text" placeholder="City" class="form-control" required autocomplete="off">
                    <br>
                    <br>
                    <input type="submit" value="ADD_CUSTOMER" class="btn btn-danger">
                    <br>
                    <br>
                    <a href="{% url 'web1' %}" class="btn btn-danger">GO TO DASHBOARD</a>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
