<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bootstrap Sample</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center text-white bg-danger">Product_Details</h2>
                <br>
                <table class="table table-bordered table-striped table-hover">
                    <tr>
                        <th>Pid</th>
                        <th>Pname</th>
                        <th>Price</th>
                        <th>Company</th>
                        <th>M_date</th>
                        <th>Exp_date</th>
                    </tr>
                    {% for p in data %}
                    <tr>
                        <td>{{p.Pid}}</td>
                        <td>{{p.Pname}}</td>
                        <td>{{p.Price}}</td>
                        <td>{{p.Company}}</td>
                        <td>{{p.M_date}}</td>
                        <td>{{p.Exp_date}}</td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
        <br>
        <hr>
        <a href="{% url 'web1' %}" class="btn btn-danger">Go TO DASHBOARD</a>
        <hr>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
