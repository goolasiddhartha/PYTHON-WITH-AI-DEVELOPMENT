<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medhnash Login Page</title>
</head>

<body>
    <hr>
    <center>
        <h1><tt>Welcome to Medhansh high school</tt></h1>
    </center>
    <hr>
    <br>
    <fieldset>
        <legend>Employee Login</legend>
        <center>
            <form action="" method="post">
                <table border="3">
                    <tr>
                        <td><label for="">Username</label></td>
                        <td><input type="text" placeholder="Username" required title="User_12345"
                                pattern="[A-Z]{1}[a-z]*[_]{1}[0-9]{5}" autocomplete="off"></td>
                    </tr>
                    <tr>
                        <td><label for="">Password</label></td>
                        <td><input type="password" placeholder="password" required title="JA_12345"
                                pattern="[A-Z]{2}[_]{1}[0-9]{5}" autocomplete="off"></td>
                    </tr>
                    <tr>
                        <td><label for="">Confirm Password</label></td>
                        <td><input type="password" placeholder="password" required title="JA_12345"
                                pattern="[A-Z]{2}[_]{1}[0-9]{5}" autocomplete="off"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" value="LOGIN"></td>
                    </tr>

                </table>
            </form>
        </center>
    </fieldset>

</body>

</html>
