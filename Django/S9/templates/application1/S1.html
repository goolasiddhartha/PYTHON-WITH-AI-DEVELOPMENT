<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Bootstrap Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <br>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center text-white bg-danger">Employee Details</h2>
                <hr>
                <hr>
                <table class="table table-bordered table-striped table-hover">
                    <tr>
                        <th>Id</th>
                        <th>Eid</th>
                        <th>Ename</th>
                        <th>Esal</th>
                        <th>Designation</th>
                        <th>Company</th>
                        <th>J_date</th>
                    </tr>
                    {% for d1 in Data %}
                    <tr>
                        <td>{{d1.id}}</td>
                        <td>{{d1.Eid}}</td>
                        <td>{{d1.Ename}}</td>
                        <td>{{d1.Esal}}</td>
                        <td>{{d1.Design}}</td>
                        <td>{{d1.Company}}</td>
                        <td>{{d1.J_date}}</td>
                    </tr>
                    {% endfor%}

                </table>
            </div>

        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
